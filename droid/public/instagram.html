<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <style>
    body {
      background: #fafafa;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .insta-container {
      max-width: 350px;
      margin: 60px auto 0 auto;
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      padding: 40px 40px 24px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .insta-logo {
      display: block;
      margin: 0 auto 30px auto;
      width: 175px;
      height: 51px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png') no-repeat center/contain;
    }
    .insta-form input {
      margin-bottom: 10px;
      border-radius: 3px;
      border: 1px solid #dbdbdb;
      background: #fafafa;
      font-size: 14px;
      width: 100%;
      padding: 10px;
    }
    .insta-btn {
      width: 100%;
      background: #3897f0;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 0;
      font-weight: 600;
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .insta-or {
      text-align: center;
      color: #999;
      margin: 18px 0 18px 0;
      position: relative;
    }
    .insta-or:before, .insta-or:after {
      content: '';
      display: inline-block;
      width: 40%;
      height: 1px;
      background: #dbdbdb;
      vertical-align: middle;
      margin: 0 8px;
    }
    .insta-fb {
      color: #385185;
      font-weight: 600;
      text-align: center;
      display: block;
      margin-bottom: 12px;
    }
    .insta-forgot {
      text-align: center;
      color: #00376b;
      font-size: 13px;
      margin-bottom: 18px;
      display: block;
    }
    .insta-signup {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #262626;
    }
    .insta-signup a {
      color: #3897f0;
      font-weight: 600;
      text-decoration: none;
    }
    .insta-footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="insta-container">
    <div class="insta-logo"></div>
    <form class="insta-form">
      <input type="text" placeholder="Phone number, username or email address" required>
      <input type="password" placeholder="Password" required>
      <button class="insta-btn" type="submit">Log in</button>
    </form>
    <div class="insta-or">OR</div>
    <a href="#" class="insta-fb"><span class="glyphicon glyphicon-facebook"></span> Log in with Facebook</a>
    <a href="#" class="insta-forgot">Forgotten your password?</a>
    <div class="insta-signup">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>
  <div class="insta-footer">
    &copy; 2025 Instagram from Meta
  </div>
</body>
</html>
